<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Christmas Village</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0b1030; }
  /* The screen. It clips the scene, so the scene never widens the page. */
  #view { position: fixed; left: 0; top: 0; right: 0; bottom: 0; overflow: hidden; }
  /* The scene is drawn at the picture's own size and scaled to fill the screen. The script sets
     the sizes from the picture's. */
  #stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #stage canvas, #stage img { position: absolute; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; }
  /* The clock and countdown: fixed on the screen while the scene scrolls behind. */
  #hud { position: fixed; left: 0; top: 0; pointer-events: none; image-rendering: pixelated; image-rendering: crisp-edges; display: none; }
  #diag { position: fixed; left: 8px; top: 8px; z-index: 9; margin: 0; padding: 8px 10px; max-width: 90vw;
    font: 13px/1.4 monospace; color: #ff0; background: rgba(0,0,0,0.8); white-space: pre-wrap; display: none; }
  /* The effects are drawn at one dot per 7 picture pixels, the size of the art's own pixels. */
  #clouds { opacity: 0; }
  #sleigh { display: none; transform-origin: 0 0; }
</style>
</head>
<body>
<div id="view">
  <div id="stage">
    <canvas id="base"></canvas>
    <canvas id="clouds"></canvas>
    <canvas id="sleigh" width="257" height="136"></canvas>
    <canvas id="fx"></canvas>
  </div>
</div>
<canvas id="hud"></canvas>
<pre id="diag"></pre>
<script src="spots.js"></script>
<script src="village.js"></script>
</body>
</html>
